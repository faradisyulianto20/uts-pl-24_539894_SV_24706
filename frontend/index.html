<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zaskia. — A Personal Journal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Terapkan tema sebelum paint agar tidak berkedip
      (function () {
        var saved = localStorage.getItem('zaskia-theme')
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var theme = saved === 'light' || saved === 'dark' ? saved : (prefersDark ? 'dark' : 'light')
        document.documentElement.setAttribute('data-theme', theme)
        if (theme === 'dark') document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
