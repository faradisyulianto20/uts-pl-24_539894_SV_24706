services:
  # ==========================================
  # 1. Service Basis Data (MySQL 8)
  # ==========================================
  db:
    image: mysql:8.0.36
    container_name: uts-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${DB_DATABASE:-uts_db}
      MYSQL_USER: ${DB_USERNAME:-uts_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-uts_pass123}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - uts-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ==========================================
  # 2. Service Backend (Laravel + FrankenPHP)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: uts-backend
    restart: unless-stopped
    environment:
      APP_NAME: "Zaskia Literary Blog API"
      APP_ENV: ${APP_ENV:-production}
      APP_KEY: ${APP_KEY:-base64:XG8d14sEHzUv8v4jY9i2x+6g2nZ1rX3mO5kQ7tP9wE=}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://localhost:8000
      LOG_CHANNEL: stack
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-uts_db}
      DB_USERNAME: ${DB_USERNAME:-uts_user}
      DB_PASSWORD: ${DB_PASSWORD:-uts_pass123}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Named volume untuk persistensi berkas cover image yang diunggah
      - app_storage:/app/storage/app/public
    ports:
      - "8000:8000"
    networks:
      - uts-network

  # ==========================================
  # 3. Service Frontend (Vue.js + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    container_name: uts-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"
    networks:
      - uts-network

# Named Volumes untuk persistensi data database & media uploads
volumes:
  db_data:
    name: uts_mysql_data
  app_storage:
    name: uts_app_storage

# Network internal Docker Compose antar service
networks:
  uts-network:
    driver: bridge
